{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}{% endblock page_title %} | K-Sookbak</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.11.2/css/all.css">
</head>
<body class="text-gray-800 mt-24 font-light">
    <header class="container fixed inset-0 bg-white max-w-full flex items-center justify-between px-6 h-20 border-b border-gray-400">
        <div class="flex items-center w-1/3">
            <a href="{% url "core:home" %}" class="mr-6">
                <img class="w-8" src="{% static 'img/airbnb.png' %}" />
            </a>
            {% block search-bar %}
            <form method="get" action="{% url "rooms:search" %}" class="w-9/12">
                <input class="search-box w-full border px-5 py-3 rounded-sm shadow-md focus:outline-none" name="city" placeholder="Search by City" />
            </form>
            {% endblock search-bar %}
        </div>
        {% include "partials/nav.html" %}
    </header>
    {% block content %}{% endblock %}
    {% include "partials/footer.html" %}
</body>
</html>
